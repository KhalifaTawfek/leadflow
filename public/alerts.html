<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadFlow AI — Alerts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233ecf8e'/><text x='50' y='55' font-size='46' font-weight='bold' text-anchor='middle' fill='%23062018'>LF</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1512">
<style>
  :root{--bg:#0d1512;--panel:#12201b;--ink:#eaf5ef;--muted:#9db3aa;--soft:#6f857c;--green:#3ecf8e;--red:#ef6f5c;--amber:#f0b84f;--line:rgba(255,255,255,.10)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:radial-gradient(circle at 0 0,rgba(62,207,142,.14),transparent 45%),var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .mark{width:34px;height:34px;display:grid;place-items:center;background:var(--green);color:#062018;border-radius:9px;font-weight:900;font-size:13px}
  h1{font-size:30px;letter-spacing:-.5px;margin:22px 0 4px}
  .sub{color:var(--muted);margin-bottom:20px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .btn{background:var(--green);color:#062018;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.on{color:var(--green);border-color:rgba(62,207,142,.5)}
  .pill.off{color:var(--amber);border-color:rgba(240,184,79,.5)}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
  .item .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--green);flex:none}
  .item.high .dot{background:var(--red);box-shadow:0 0 10px rgba(239,111,92,.7)}
  .item .body{flex:1}
  .item .t{font-weight:700}
  .item .d{color:var(--muted);font-size:14px}
  .item .when{color:var(--soft);font-size:12px;white-space:nowrap}
  .msg{color:var(--soft);font-size:14px;margin-top:10px}
  a{color:var(--green)}
  .topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 22px}
  .topnav a{padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
  .topnav a:hover{border-color:var(--green);color:var(--green)}
  .topnav a.active{background:var(--green);color:#062018;border-color:transparent}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">LF</span> LeadFlow AI</div>
  <nav class="topnav">
    <a href="/">🛒 Shop</a>
    <a href="/admin">🛡 CRM</a>
    <a href="/alerts" class="active">🔔 Alerts</a>
    <a href="/status">📊 Status</a>
    <a href="https://cookblog.net" target="_blank" rel="noopener">🍳 CookBlog</a>
    <a href="https://status.cookblog.net/dashboard" target="_blank" rel="noopener">📈 Monitor</a>
  </nav>
  <h1>Alerts</h1>
  <p class="sub">Recent new-lead and daily-report notifications.</p>

  <div class="bar">
    <button class="btn" id="testBtn">Send test Telegram</button>
    <button class="btn ghost" id="refreshBtn">Refresh</button>
    <span class="pill" id="tgPill">Telegram: …</span>
  </div>

  <div id="list"></div>
  <p class="msg" id="msg"></p>
</div>

<script>
  const el = (id)=>document.getElementById(id);
  function ago(iso){
    const s=Math.floor((Date.now()-new Date(iso))/1000);
    if(s<60)return s+'s ago'; if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';
  }
  const NAMES={NEW_LEAD:'New lead',DAILY_REPORT:'Daily report',REPLY_SENT:'Reply sent to customer'};
  window.toggleDetail=(i)=>{const e=document.getElementById('det-'+i);if(e)e.style.display=e.style.display==='none'?'block':'none';};
  async function load(){
    try{
      const r=await fetch('/api/alerts',{cache:'no-store'});
      if(r.status===401||r.status===403){ el('list').innerHTML='<div class="item"><div class="body"><div class="t">Staff login required</div><div class="d">Please <a href="/admin">sign in to the CRM</a> first, then reopen this page.</div></div></div>'; return; }
      const d=await r.json();
      el('tgPill').textContent = 'Telegram: '+(d.telegram?'connected':'not set up');
      el('tgPill').className = 'pill '+(d.telegram?'on':'off');
      const a=d.alerts||[];
      if(!a.length){ el('list').innerHTML='<div class="item"><div class="body"><div class="t">No alerts yet</div><div class="d">New leads and daily reports will appear here.</div></div></div>'; return; }
      el('list').innerHTML=a.map((x,i)=>{
        const head=`${x.high?'🚨 ':''}${NAMES[x.action]||x.action}`;
        const detail=(x.detail||'').replace(/</g,'&lt;');
        if(x.leadId){
          // New-lead / reply alerts link straight to the lead in the CRM.
          return `<a class="item ${x.high?'high':''}" href="/admin?lead=${encodeURIComponent(x.leadId)}" style="text-decoration:none;color:inherit;cursor:pointer">
            <span class="dot"></span>
            <div class="body"><div class="t">${head}</div><div class="d">${detail}</div>
              <div style="color:var(--green);font-size:12px;margin-top:4px">Open lead in CRM →</div></div>
            <div class="when">${ago(x.at)}</div></a>`;
        }
        // Daily reports (no lead) expand to show the numbers.
        return `<div class="item" style="cursor:pointer" onclick="toggleDetail(${i})">
          <span class="dot"></span>
          <div class="body"><div class="t">${head} <span style="color:var(--soft);font-size:12px">(tap to expand)</span></div><div class="d">${detail}</div>
            <div id="det-${i}" style="display:none;margin-top:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px">${detail.split('·').map(s=>`<div>${s.trim()}</div>`).join('')}</div></div>
          <div class="when">${ago(x.at)}</div></div>`;
      }).join('');
    }catch(e){ el('msg').textContent='Could not load alerts.'; }
  }
  el('refreshBtn').onclick=load;
  el('testBtn').onclick=async()=>{
    el('msg').textContent='Sending…';
    try{
      const r=await fetch('/api/telegram/test',{method:'POST'});
      const d=await r.json();
      el('msg').textContent = d.message || (d.ok?'Sent.':'Failed.');
    }catch(e){ el('msg').textContent='Request failed.'; }
  };
  load(); setInterval(load, 20000);
</script>
</body>
</html>
