<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudHelm - System Status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23060D18'/><g transform='translate(11 11) scale(.78)'><circle cx='50' cy='50' r='42' fill='none' stroke='%2352B8E0' stroke-width='10'/><path d='M50 15V35M50 65V85M15 50H35M65 50H85M24.5 24.5L38 38M62 62L75.5 75.5M75.5 24.5L62 38M38 62L24.5 75.5' stroke='%2352B8E0' stroke-width='7' stroke-linecap='round'/><circle cx='50' cy='50' r='14' fill='none' stroke='%2352B8E0' stroke-width='7'/><circle cx='50' cy='50' r='5' fill='%2352B8E0'/></g></svg>">
<style>
  :root{--bg:#060D18;--panel:#0D141F;--ink:#F1F5F9;--muted:#8DA4BF;--soft:#5F7187;--accent:#52B8E0;--red:#ef6f5c;--amber:#f0b84f;--line:#1F2A3A}
  *{box-sizing:border-box;margin:0;padding:0}
  button,input,select,textarea{font-family:inherit}
  body{font-family:"Sofia Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:
    radial-gradient(circle at 0 0,rgba(82,184,224,.14),transparent 45%),var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .mark{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:#04111C;border-radius:9px;font-weight:900;font-size:13px}
  h1{font-size:30px;letter-spacing:-.5px;margin:22px 0 4px}
  .sub{color:var(--muted);margin-bottom:24px}
  .overall{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .dot{width:14px;height:14px;border-radius:50%}
  .dot.ok{background:var(--accent);box-shadow:0 0 12px rgba(82,184,224,.7)}
  .dot.bad{background:var(--red);box-shadow:0 0 12px rgba(239,111,92,.7)}
  .overall b{font-size:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
  .card .name{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .card .state{font-size:20px;font-weight:800}
  .card .state.ok{color:var(--accent)}.card .state.bad{color:var(--red)}
  .card .num{font-size:26px;font-weight:800;color:var(--ink)}
  .grid4{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:520px){.grid4{grid-template-columns:1fr 1fr}}
  .topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 22px}
  .topnav a{padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
  .topnav a:hover{border-color:var(--accent);color:var(--accent)}
  .topnav a.active{background:var(--accent);color:#04111C;border-color:transparent}
  .meta{color:var(--soft);font-size:13px;margin-top:18px;text-align:center}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .brand .mark,.mark{background:none;color:var(--accent);border-radius:0}.mark svg{width:100%;height:100%;display:block}
  .brand{font-family:"DM Sans","Sofia Sans",sans-serif;font-weight:600;letter-spacing:-.025em;color:var(--accent)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600&family=Sofia+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="10"/><path d="M50 15V35M50 65V85M15 50H35M65 50H85M24.5 24.5L38 38M62 62L75.5 75.5M75.5 24.5L62 38M38 62L24.5 75.5" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="50" cy="50" r="5" fill="currentColor"/></svg></span> CloudHelm</div>
  <nav class="topnav">
    <a href="/">🛒 Shop</a>
    <a href="/admin">🛡 CRM</a>
    <a href="/alerts">🔔 Alerts</a>
    <a href="/status" class="active">📊 Status</a>
    <a href="https://cookblog.net" target="_blank" rel="noopener">🍳 CookBlog</a>
    <a href="https://status.cookblog.net/dashboard" target="_blank" rel="noopener">📈 Monitor</a>
  </nav>
  <h1>System status</h1>
  <p class="sub">Live health of the platform's core components - refreshes automatically.</p>

  <div class="overall" id="overall">
    <span class="dot" id="overallDot"></span>
    <b id="overallText">Checking…</b>
  </div>

  <div class="grid">
    <div class="card"><div class="name">API</div><div class="state" id="s-api">-</div></div>
    <div class="card"><div class="name">Database</div><div class="state" id="s-db">-</div></div>
    <div class="card"><div class="name">Automation</div><div class="state" id="s-agent">-</div></div>
  </div>

  <h2 style="font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 12px">Live numbers</h2>
  <div class="grid grid4">
    <div class="card"><div class="name">Total leads</div><div class="num" id="n-leads">-</div></div>
    <div class="card"><div class="name">Leads today</div><div class="num" id="n-today">-</div></div>
    <div class="card"><div class="name">Open</div><div class="num" id="n-open">-</div></div>
    <div class="card"><div class="name">Customers</div><div class="num" id="n-cust">-</div></div>
  </div>

  <p class="meta" id="meta"></p>
</div>

<script>
  function setState(id, up){
    const el=document.getElementById(id);
    el.textContent = up ? 'Operational' : 'Down';
    el.className = 'state ' + (up ? 'ok' : 'bad');
  }
  async function load(){
    try{
      const r = await fetch('/api/health', {cache:'no-store'});
      const d = await r.json();
      const s = d.services || {};
      setState('s-api', s.api === 'ok');
      setState('s-db', s.db === 'ok');
      setState('s-agent', s.agent === 'ok');
      const allOk = s.api==='ok' && s.db==='ok' && s.agent==='ok';
      document.getElementById('overallDot').className = 'dot ' + (allOk?'ok':'bad');
      document.getElementById('overallText').textContent = allOk ? 'All systems operational' : 'Some systems are degraded';
      const c = d.counts || {};
      const setNum = (id,v)=>{ document.getElementById(id).textContent = (v===undefined||v===null)?'-':v; };
      setNum('n-leads', c.leads); setNum('n-today', c.leadsToday); setNum('n-open', c.openLeads); setNum('n-cust', c.customers);
      const up = d.uptime||0; const h=Math.floor(up/3600), m=Math.floor((up%3600)/60);
      const lat = d.dbLatencyMs!=null ? ` · DB ${d.dbLatencyMs}ms` : '';
      document.getElementById('meta').textContent = `Uptime ${h}h ${m}m${lat} · last checked ${new Date().toLocaleTimeString()}`;
    }catch(e){
      ['s-api','s-db','s-agent'].forEach(id=>setState(id,false));
      document.getElementById('overallDot').className='dot bad';
      document.getElementById('overallText').textContent='Cannot reach the server';
      document.getElementById('meta').textContent='Retrying…';
    }
  }
  load(); setInterval(load, 10000);
</script>
</body>
</html>
