<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadFlow · IT, Cyber, Cloud & Automation</title>
<meta name="description" content="Account security, servers, cloud, automation, chatbots, Docker, Cloudflare and monitoring. Register, request a service, and track it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2352B8E0'/><text x='50' y='55' font-size='46' font-weight='bold' text-anchor='middle' fill='%2304111C'>LF</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
<script src="/firebase-config.js"></script>
<style>
  :root{--bg:#060D18;--panel:#0D141F;--panel2:#1A202A;--ink:#F1F5F9;--muted:#8DA4BF;--soft:#5F7187;
    --accent:#52B8E0;--accent2:#7CCBEB;--ok:#34D399;--amber:#F0B84F;--red:#EF6F5C;--blue:#63BDE7;--purple:#A5B4FC;
    --line:#1F2A3A;--line2:#252E3B;--r:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Sofia Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:640px;background:radial-gradient(ellipse 55% 60% at 75% 0%,rgba(82,184,224,.12),transparent 70%);pointer-events:none;z-index:-1}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(6,13,24,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:24px;padding:14px 24px;max-width:1160px;margin:0 auto;position:relative}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.3px}
  .brand .mark{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:#04111C;border-radius:10px;font-weight:900;font-size:13px}
  .nav .links{display:flex;gap:22px;margin-left:auto;color:var(--muted);font-weight:600;font-size:15px;align-items:center}
  .nav .links a{cursor:pointer;transition:color .15s}.nav .links a:hover{color:var(--ink)}
  .menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:18px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .btn.primary{background:var(--accent);color:#04111C}.btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn:disabled{opacity:.6;cursor:default}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px;color:var(--ink)}
  .chip .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#04111C;display:grid;place-items:center;font-weight:800;font-size:12px}

  /* type + sections */
  section{padding:64px 0}
  section[id]{scroll-margin-top:72px}
  .eyebrow,.subs-kicker{display:inline-flex;align-items:center;gap:10px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  .eyebrow::before,.subs-kicker::before{content:"";width:20px;height:2px;background:var(--accent);border-radius:2px}
  h2.sec{font-size:clamp(30px,3.8vw,46px);line-height:1.08;letter-spacing:-1.2px;font-weight:800;margin-bottom:12px}
  .sec-sub{color:var(--muted);font-size:17px;max-width:62ch;margin-bottom:30px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .price{color:var(--accent);font-weight:700;font-size:14px}

  /* hero */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:84px 0 48px}
  .hero h1{font-size:clamp(44px,6.4vw,74px);line-height:1;letter-spacing:-2.5px;font-weight:800;margin-bottom:22px}
  .hero h1 span{color:var(--accent)}
  .hero p.lead{color:var(--muted);font-size:19px;max-width:48ch;margin-bottom:32px}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap}
  .hero-visual{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:14px;aspect-ratio:10/9}
  .hero-visual svg{width:100%;height:100%;display:block;font-family:inherit}
  .flow{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  @keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .stat{padding:24px 26px;border-left:1px solid var(--line)}.stat:first-child{border-left:0}
  .stat b{display:block;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.8px}
  .stat span{color:var(--muted);font-size:14px}

  /* cards / grids */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .svc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;transition:border-color .15s,background .15s}
  .svc:hover{border-color:rgba(82,184,224,.45);background:#0F1826}
  .svc h3{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:8px}
  .svc p{color:var(--muted);font-size:15px;margin-bottom:18px;flex:1}
  .svc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
  .svc .tag{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .svc .result{color:var(--accent);font-weight:700;font-size:14px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(82,184,224,.45);color:var(--accent);font-weight:800;margin-bottom:16px}
  .step h3{font-size:19px;font-weight:700;margin-bottom:6px}.step p{color:var(--muted);font-size:15px}
  .tech{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 34px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--soft);font-size:18px;font-weight:700}
  .tech small{width:100%;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
  .cta{text-align:center;margin:24px 0 8px;padding:56px 24px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
  .cta .sec-sub{margin-left:auto;margin-right:auto}

  /* forms */
  label{display:grid;gap:6px;font-weight:600;color:var(--muted);font-size:14px;margin-bottom:16px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:#F8FBFF;padding:12px 14px;font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
  input::placeholder,textarea::placeholder{color:var(--soft)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,184,224,.18)}
  textarea{min-height:110px;resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .notice{padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:14px}
  .notice.err{background:rgba(239,111,92,.12);color:#FFB4A6;border:1px solid rgba(239,111,92,.25)}
  .notice.info{background:rgba(82,184,224,.10);color:#BFE6F6;border:1px solid rgba(82,184,224,.25)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(2,6,12,.72);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:20px}
  .modal-bg.open{display:grid}
  .modal{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:28px}
  .modal h3{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
  .modal .switch{margin-top:16px;color:var(--muted);font-size:14px}.modal .switch a{color:var(--accent);font-weight:700;cursor:pointer}
  .x{float:right;cursor:pointer;color:var(--soft);font-size:24px;line-height:1}.x:hover{color:var(--ink)}

  /* checkout / offer */
  .checkout{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:18px;margin-top:8px}
  .checkout .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
  .checkout .row.total{border-top:1px solid var(--line2);margin-top:8px;padding-top:12px;font-weight:800;font-size:18px}
  .free{color:var(--accent);font-weight:800}
  .beta{display:inline-block;background:rgba(82,184,224,.14);color:var(--accent);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:8px}

  /* my requests */
  .req{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
  .req .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .req h3{font-size:18px;font-weight:700}
  .req .meta{color:var(--soft);font-size:13px;margin:4px 0 10px}
  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .b-Received{background:rgba(99,189,231,.14);color:var(--blue)}
  .b-Inprogress{background:rgba(240,184,79,.14);color:var(--amber)}
  .b-Quotesent{background:rgba(165,180,252,.14);color:var(--purple)}
  .b-Completed{background:rgba(52,211,153,.14);color:var(--ok)}
  .b-Closed{background:rgba(239,111,92,.14);color:#FFB4A6}
  .ai-box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-top:12px;font-size:14px}
  .ai-box h4{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
  .empty{color:var(--muted);text-align:center;padding:48px 10px}

  /* subscription plans */
  .subs-inner{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:44px 36px}
  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
  .plan{position:relative;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column}
  .plan.featured{border-color:var(--accent)}
  .plan-badge{position:absolute;top:-12px;left:24px;background:var(--accent);color:#04111C;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .plan h3{font-size:19px;font-weight:700;margin-bottom:6px}
  .plan-price{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0}
  .plan-price span{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
  .plan-tag{color:var(--muted);font-size:15px;margin-bottom:18px;min-height:44px}
  .plan-feats{list-style:none;display:grid;gap:10px;margin:0 0 22px;flex:1;padding-top:18px;border-top:1px solid var(--line)}
  .plan-feats li{position:relative;padding-left:26px;font-size:15px}
  .plan-feats li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}

  /* footer */
  footer{border-top:1px solid var(--line);color:var(--soft);padding:40px 0;margin-top:40px;font-size:14px}
  .foot-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .foot-grid a{color:var(--muted)}.foot-grid a:hover{color:var(--ink)}
  .foot-links{display:flex;gap:22px;flex-wrap:wrap}

  /* responsive */
  @media(max-width:900px){
    .menu-btn{display:grid;place-items:center}
    .nav .links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;margin:0;padding:6px 24px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
    .nav.open .links{display:flex}
    .nav .links>a,.nav .links>span{padding:13px 2px;border-bottom:1px solid var(--line)}
    .nav .links>.btn{margin-top:12px}
    .hero{grid-template-columns:1fr;gap:36px;padding:56px 0 32px}
    .hero-visual{max-width:520px}
    .grid,.steps{grid-template-columns:1fr 1fr}
    .price-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
    .form-grid{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.nav{padding-left:16px;padding-right:16px}
    section{padding:44px 0}
    .grid,.steps{grid-template-columns:1fr}
    .stat{padding:18px}.stat b{font-size:26px}
    .subs-inner{padding:30px 18px}
    .cta{padding:40px 18px}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<body>
<header>
  <nav class="nav">
    <a class="brand" href="#" onclick="go('home');return false"><span class="mark">LF</span> LeadFlow</a>
    <button class="menu-btn" aria-label="Menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
    <div class="links" id="navLinks" onclick="document.querySelector('.nav').classList.remove('open')"></div>
  </nav>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap foot-grid">
    <div>
      <div class="brand" style="font-size:17px;margin-bottom:6px"><span class="mark">LF</span> LeadFlow</div>
      <div>IT · Cyber · Cloud · Automation · Remote, worldwide</div>
      <div style="margin-top:6px"><a href="mailto:admin@cookblog.net">admin@cookblog.net</a></div>
    </div>
    <div class="foot-links">
      <a onclick="goToSection('pricing')" style="cursor:pointer">Plans</a>

<!-- Auth modal -->
<div class="modal-bg" id="authModal">
  <div class="modal">
    <span class="x" onclick="closeAuth()">×</span>
    <h3 id="authTitle">Log in</h3>
    <p class="sec-sub" id="authSub" style="margin:4px 0 16px">Welcome back.</p>
    <div id="authNotice"></div>
    <div id="authBody"></div>
  </div>
</div>

<script>
  let me = null, services = [], serviceMap = {}, pending = null, planPending = null;

  // Real portfolio - one proof example per service (things actually built).
  const CASES = [
    { tag:"Servers / RDP", title:"Multi-site Ubuntu VPS", body:"Set up and secured an Ubuntu server - non-root user, SSH keys, firewall, and Nginx reverse proxy - hosting three live production sites on one machine, each with HTTPS.", result:"3 sites live, isolated & auto-restarting", link:"https://cookblog.net" },
    { tag:"Docker / DevOps", title:"One-command Docker deploy", body:"Packaged a Node.js + PostgreSQL app into Docker Compose so the whole stack builds and starts with a single command, with a clean rebuild and update flow.", result:"Reproducible, one-command deploys", link:"" },
    { tag:"Cloudflare / Network", title:"DNS, SSL & DDoS protection", body:"Moved cookblog.net onto Cloudflare: configured DNS, Full-strict SSL, and DDoS/WAF protection while hiding the origin server's real IP.", result:"Encrypted, shielded, faster", link:"https://cookblog.net" },
    { tag:"Account Security", title:"Hardened web-app login", body:"Implemented bcrypt password hashing, signed httpOnly sessions, login rate-limiting, and role-based access to protect user accounts from brute-force and takeover.", result:"No plaintext passwords · brute-force blocked", link:"" },
    { tag:"Automation", title:"Automated lead intake", body:"Built a system that captures customer requests, classifies them, scores urgency, drafts replies, and notifies the team and customer by email, automatically.", result:"Every request triaged in seconds", link:"" },
    { tag:"Chatbots & Integrations", title:"Telegram alert bot", body:"Built a bot that delivers instant notifications and can connect a site to Telegram, WhatsApp or Discord, plus custom API and tool integrations.", result:"Real-time alerts & connected tools", link:"" },
    { tag:"Cloud", title:"Cloud hosting & deploys", body:"Provisioned and secured cloud servers, set up domains, SSL and backups, and shipped apps that scale, all managed for the client.", result:"Hosted, scaled & looked after", link:"" },
    { tag:"Monitoring", title:"Health checks & alerts", body:"Added a health endpoint reporting API, database, and agent status, plus an automated daily report - so issues are caught before customers notice.", result:"Early warning on downtime", link:"" }
  ];

  // Managed monthly plans - the recurring offer. Prices in EUR.
  const PLANS = [
    { id:"starter", name:"Starter", price:"€19", period:"/mo", tagline:"Keep a site online, safe and backed up.",
      features:["Managed hosting on our server","SSL certificate (HTTPS)","Cloudflare protection (DDoS + WAF)","Weekly off-site backups","Uptime monitoring + alerts"], featured:false },
    { id:"business", name:"Business", price:"€39", period:"/mo", tagline:"Everything in Starter, plus your domain and edits.",
      features:["Everything in Starter","Domain name included","Content edits (~1 hour / month)","Monthly health & traffic report","Priority email support"], featured:true },
    { id:"pro", name:"Pro", price:"€79", period:"/mo", tagline:"For sites that can't afford downtime.",
      features:["Everything in Business","Priority fixes (same business day)","Security hardening & reviews","Business email setup","More edit time (~3 hours / month)"], featured:false }
  ];
  function pricingSectionHTML(){
    const cards = PLANS.map(p=>`
      <div class="plan${p.featured?' featured':''}">
        ${p.featured?'<span class="plan-badge">Most popular</span>':''}
        <h3>${esc(p.name)}</h3>
        <div class="plan-price">${esc(p.price)}<span>${esc(p.period)}</span></div>
        <p class="plan-tag">${esc(p.tagline)}</p>
        <ul class="plan-feats">${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
        <button class="btn ${p.featured?'primary':'ghost'}" style="width:100%" onclick="choosePlan('${p.id}')">Choose ${esc(p.name)}</button>
      </div>`).join('');
    return `
      <section id="pricing" class="subs">
        <div class="subs-inner">
          <span class="subs-kicker">Subscriptions</span>
          <h2 class="sec">Subscription plans</h2>
          <p class="sec-sub">Website, hosting, protection and domain, handled every month. Cancel anytime. One-off builds start at €250 (waived on a 12-month plan).</p>
          <div class="price-grid">${cards}</div>
          <p class="sec-sub" style="margin-top:16px;font-size:13px">Prices exclude VAT where applicable. "Protection" means backups, Cloudflare, updates and monitoring, not a guarantee against every attack. Full terms apply.</p>
        </div>
      </section>`;
  }
  function choosePlan(id){
    const p = PLANS.find(x=>x.id===id) || PLANS[0];
    planPending = p;
    startRequest("Website + Domain + Protection");
  }
  // ---- Firebase auth (optional / dual-mode) ----
  // If firebase-config.js holds a real config, we use Firebase for sign-in and
  // send its ID token with every request. Otherwise the original cookie-based
  // login is used and nothing here runs.
  let FB=null, fbAuth=null, fbUser=null, backendFirebase=false;
  function firebaseConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/^PASTE/i.test(c.apiKey)); }
  // Only use Firebase when BOTH the browser config and the server key are present,
  // so deploying one without the other can never lock anyone out.
  function useFirebase(){ return firebaseConfigured() && backendFirebase; }
  async function authHeader(){
    if(fbAuth && fbAuth.currentUser){
      try{ return { Authorization: 'Bearer ' + (await fbAuth.currentUser.getIdToken()) }; }catch(e){}
    }
    return {};
  }
  async function initFirebase(){
    if(!firebaseConfigured()) return;
    const V='12.9.0';
    try{
      const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      FB = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
      fbAuth = FB.getAuth(appMod.initializeApp(window.FIREBASE_CONFIG));
      FB.onAuthStateChanged(fbAuth, async (u)=>{ fbUser=u; await loadMe(); });
    }catch(e){ console.error('Firebase failed to load:', e); }
  }

  async function api(path, opts={}){
    const extra = await authHeader();
    const r = await fetch(path,{...opts,headers:{'content-type':'application/json',...extra,...(opts.headers||{})}});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Something went wrong.');
    return d;
  }
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    {cat:"Servers / RDP", kw:["server","rdp","remote desktop","vps","ssh","hosting","downtime","reboot"], est:"3-6 hours"},

    {cat:"Website + Domain + Protection", kw:["website","web site","domain","hosting","landing page","build my site","online store","wordpress","web presence","subscription","make me a site","e-commerce"], est:"3-7 days setup"}
  ];
  function triage(text, urgency){
    const t=text.toLowerCase(); let best=null,hits=0;
    for(const r of AGENT_RULES){ const h=r.kw.filter(k=>t.includes(k)).length; if(h>hits){hits=h;best=r;} }
    const rule = best||{cat:"General IT Services",est:"2-5 hours"};
    const uw={urgent:4,high:3,normal:1,low:0}[urgency]??1;
    let p=3+uw+(text.length>160?1:0)+((rule.cat==="Account Security"||rule.cat==="Cloudflare / Network")?1:0);
    return {category:rule.cat, estimate:rule.est, priority:Math.max(1,Math.min(10,p))};
  }
  async function sha1hex(str){
    const buf=await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  function pwStrength(pw){
    let s=0; if(pw.length>=8)s++; if(pw.length>=12)s++; if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++; if(/[0-9]/.test(pw))s++; if(/[^A-Za-z0-9]/.test(pw))s++;
    return s;
  }

    }

    const btn = document.getElementById('reqSubmit');
    btn.disabled=true; btn.textContent='Placing…';
    try{
      const res = await api('/api/leads',{method:'POST',body:JSON.stringify(data)});
      const a = res.analysis||{};
      app.innerHTML = `
        <section style="max-width:640px;margin:0 auto">
          <div class="card" style="text-align:center">
            <div style="font-size:44px">✅</div>
            <h2 class="sec" style="margin-top:8px">Request placed!</h2>
            <p class="sec-sub">${esc(res.message)}</p>
            <div class="ai-box" style="text-align:left">
              <h4>✅ We received your request</h4>
              <p><b>Category:</b> ${esc(a.category)} · <b>Est.:</b> ${esc(a.estimateHours)}</p>
              ${a.reply?`<p style="margin-top:10px;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em">Our reply to you</p><p style="white-space:pre-wrap;margin-top:4px">${esc(a.reply)}</p>`:''}
              ${a.questions?`<p style="margin-top:10px;color:var(--muted)">To move faster, please have these ready:</p><ul style="margin:6px 0 0 18px;color:var(--muted)">${a.questions.split('\n').map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}
            </div>
            <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button class="btn primary" onclick="go('mine')">Track my requests</button>
              <button class="btn ghost" onclick="go('home')">Back home</button>
            </div>
          </div>
        </section>`;
      checkoutReady=false; pending=null; planPending=null;
    }catch(err){
      btn.disabled=false; btn.textContent='Place request (free) →';
      document.getElementById('reqNotice').innerHTML = `<div class="notice err">${esc(err.message)}</div>`;
    }
  }

  async function renderMine(){
    if(!me){ openAuth('login'); return renderHome(); }
    app.innerHTML = `<section><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2 class="sec">My requests</h2><button class="btn primary sm" onclick="startRequest()">+ New request</button></div><div id="mineList" style="margin-top:16px"><div class="empty">Loading…</div></div></section>`;
    await buildMine();
    if(mineTimer) clearInterval(mineTimer);
    mineTimer = setInterval(pollMine, 12000);   // pick up the team's reply (~1 min)
  }
  function threadHTML(l){
    const msgs = l.messages||[];
    if(!msgs.length) return '<div class="sec-sub" style="font-size:13px">No messages yet.</div>';
    return msgs.map(m=>{
      const team = m.sender==='team';
      return `<div style="display:flex;justify-content:${team?'flex-start':'flex-end'};margin:6px 0"><div style="max-width:85%;background:${team?'var(--panel2)':'var(--accent)'};color:${team?'var(--ink)':'#04111C'};border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap">${esc(m.text)}</div></div>`;
    }).join('');
  }
  async function buildMine(){
    try{
      const { leads } = await api('/api/my/leads');
      const box = document.getElementById('mineList'); if(!box) return;
      if(!leads.length){ box.innerHTML = `<div class="empty">You haven't requested anything yet. <a style="color:var(--accent);cursor:pointer" onclick="startRequest()">Request a service →</a></div>`; return; }
      box.innerHTML = leads.map(l=>{
        const a=l.analysis||{}; const cls='b-'+(l.statusLabel||'').replace(/\s/g,'');
        return `<div class="req">
          <div class="top"><h3>${esc(a.category||l.serviceType)}</h3><span class="badge ${cls}">${esc(l.statusLabel)}</span></div>
          <div class="meta">Requested ${new Date(l.createdAt).toLocaleDateString()} · Est. ${esc(a.estimateHours||'-')} · Urgency ${esc(a.aiUrgency||a.urgencyLabel||l.urgency)}</div>
          <p>${esc(l.problem)}</p>
          <div class="ai-box" style="border-color:rgba(82,184,224,.45)">
            <h4>💬 Conversation</h4>
            <div id="thread-${l.id}" style="max-height:320px;overflow-y:auto;padding-right:4px">${threadHTML(l)}</div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <input id="msgin-${l.id}" placeholder="Write a reply…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg('${l.id}')}">
              <button class="btn primary sm" onclick="sendMsg('${l.id}')">Send</button>
            </div>
            <p class="sec-sub" style="font-size:12px;margin-top:6px">Our team usually replies within a minute. You can also arrange a call on Google Meet or Discord.</p>
          </div>
          ${a.questions?`<div class="ai-box"><h4>What we still need from you</h4><ul style="margin:0 0 0 18px;color:var(--muted)">${a.questions.split('\n').map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}
        </div>`;
      }).join('');
      // Jump each thread to the latest message.
      leads.forEach(l=>{ const el=document.getElementById('thread-'+l.id); if(el) el.scrollTop=el.scrollHeight; });
    }catch(e){ const box=document.getElementById('mineList'); if(box) box.innerHTML=`<div class="notice err">${esc(e.message)}</div>`; }
  }
  // Poll: refresh only the thread bodies so typing isn't interrupted.
  async function pollMine(){
    try{
      const { leads } = await api('/api/my/leads');
      for(const l of leads){
        const el=document.getElementById('thread-'+l.id); if(!el) continue;
        const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.innerHTML = threadHTML(l);
        if(atBottom) el.scrollTop = el.scrollHeight;
      }
    }catch(e){}
  }
  async function sendMsg(id){
    const inp=document.getElementById('msgin-'+id); if(!inp) return;
    const t=(inp.value||'').trim(); if(!t) return;
    inp.value=''; inp.disabled=true;
    try{
      await api('/api/my/leads/'+id+'/messages',{method:'POST',body:JSON.stringify({text:t})});
      await pollMine();
      const el=document.getElementById('thread-'+id); if(el) el.scrollTop=el.scrollHeight;
    }catch(e){ inp.value=t; alert(e.message); }
    inp.disabled=false; inp.focus();
  }

  // ---- Auth modal (dual-mode: Firebase when configured, else cookie login) ----
  let authMode='login';
  function closeAuth(){ document.getElementById('authModal').classList.remove('open'); }
  function authError(msg){ document.getElementById('authNotice').innerHTML = `<div class="notice err">${esc(msg)}</div>`; }

  function openAuth(mode, msg){
    authMode = mode;
    const fb = useFirebase();
    document.getElementById('authModal').classList.add('open');
    document.getElementById('authTitle').textContent = mode==='login'?'Log in':'Create your account';
    document.getElementById('authSub').textContent = msg || (mode==='login'?'Welcome back.':"Sign up to request and track services. It's free.");
    document.getElementById('authNotice').innerHTML = msg?`<div class="notice info">${esc(msg)}</div>`:'';
    const idField = fb
      ? `<label>Email<input id="authEmail" type="email" autocomplete="email" placeholder="you@email.com"></label>`
      : `<label>Username<input id="authUser" autocomplete="username"></label>`;
    document.getElementById('authBody').innerHTML = `
      ${idField}
      <label>Password<input id="authPass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"></label>
      ${fb&&mode==='login'?`<div style="text-align:right;margin:-8px 0 12px"><a id="forgotLink" style="color:var(--accent);cursor:pointer;font-size:13px">Forgot password?</a></div>`:''}
      <button class="btn primary" style="width:100%" id="authBtn">${mode==='login'?'Log in':'Create account'}</button>
      ${fb?`<div style="display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12px;margin:12px 0"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
            <button class="btn ghost" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px" id="googleBtn">${GOOGLE_G}${mode==='register'?'Sign up with Google':'Continue with Google'}</button>`:''}
      <p class="switch" id="authSwitch">${mode==='login'?`New here? <a onclick="openAuth('register')">Create an account</a>`:`Already have an account? <a onclick="openAuth('login')">Log in</a>`}</p>`;
    document.getElementById('authBtn').addEventListener('click', doAuth);
    document.getElementById('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
    if(fb){
      document.getElementById('googleBtn').addEventListener('click', doGoogle);
      const fl=document.getElementById('forgotLink'); if(fl) fl.addEventListener('click', doReset);
    }
    setTimeout(()=>{ const f=document.getElementById(fb?'authEmail':'authUser'); if(f) f.focus(); },50);
  }

  async function afterAuth(){ await loadMe(); closeAuth(); if(pending){ renderRequest(); } else { go('mine'); } }

  async function doAuth(){
    const password = document.getElementById('authPass').value;
    const btn=document.getElementById('authBtn');
    if(useFirebase()){
      const email = (document.getElementById('authEmail').value||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authError('Please enter a valid email.');
      if(password.length < (authMode==='register'?8:1)) return authError(authMode==='register'?'Password must be at least 8 characters.':'Please enter your password.');
      btn.disabled=true; btn.textContent='…';
      try{
        if(authMode==='register') await FB.createUserWithEmailAndPassword(fbAuth, email, password);
        else await FB.signInWithEmailAndPassword(fbAuth, email, password);
        await afterAuth();
      }catch(err){ authError(fbMsg(err)); btn.disabled=false; btn.textContent=authMode==='login'?'Log in':'Create account'; }
      return;
    }
    const username = (document.getElementById('authUser').value||'').trim();
    if(username.length<3) return authError('Username must be at least 3 characters.');
    if(authMode==='register' && password.length<8) return authError('Password must be at least 8 characters.');
    if(!password) return authError('Please enter your password.');
    btn.disabled=true; btn.textContent='…';
    try{
      await api(authMode==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify({username,password})});
      await afterAuth();
    }catch(err){ authError(err.message); btn.disabled=false; btn.textContent=authMode==='login'?'Log in':'Create account'; }
  }

  async function doGoogle(){
    try{ await FB.signInWithPopup(fbAuth, new FB.GoogleAuthProvider()); await afterAuth(); }
    catch(err){ authError(fbMsg(err)); }
  }
  async function doReset(){
    const email=(document.getElementById('authEmail').value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authError('Enter your email above first, then click Forgot password.');
    try{ await FB.sendPasswordResetEmail(fbAuth, email); document.getElementById('authNotice').innerHTML='<div class="notice info">Password reset email sent - check your inbox.</div>'; }
    catch(err){ authError(fbMsg(err)); }
  }
  function fbMsg(err){
    const c=(err&&err.code)||'';
    if(c.includes('email-already-in-use')) return 'That email already has an account - try logging in.';
    if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Invalid email or password.';
    if(c.includes('weak-password')) return 'Password is too weak.';
    if(c.includes('popup-closed')||c.includes('cancelled-popup')) return 'Sign-in was cancelled.';
    if(c.includes('too-many-requests')) return 'Too many attempts - please wait a moment.';
    return (err&&err.message)||'Authentication failed.';
  }

  async function logout(){
    if(fbAuth){ try{ await FB.signOut(fbAuth); }catch(e){} }
    try{ await api('/api/auth/logout',{method:'POST'}); }catch(e){}
    me=null; fbUser=null; renderNav(); go('home');
  }

  (async function init(){
    await loadServices();
    await loadMe();                       // sets backendFirebase from /api/auth/me
    if(useFirebase()){ await initFirebase(); }
    renderHome();
  })();
</script>
</body>
</html>
