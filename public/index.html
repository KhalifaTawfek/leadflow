<style>
  :root{--bg:#060D18;--panel:#0D141F;--panel2:#1A202A;--ink:#F1F5F9;--muted:#8DA4BF;--soft:#5F7187;
    --accent:#52B8E0;--accent2:#7CCBEB;--ok:#34D399;--amber:#F0B84F;--red:#EF6F5C;--blue:#63BDE7;--purple:#A5B4FC;
    --line:#1F2A3A;--line2:#252E3B;--r:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Sofia Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:640px;background:radial-gradient(ellipse 55% 60% at 75% 0%,rgba(82,184,224,.12),transparent 70%);pointer-events:none;z-index:-1}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(6,13,24,.82);backdrop-filter:blur(14px);border-bottom:1px dashed var(--line2)}
  .nav{display:flex;align-items:center;gap:24px;padding:14px 24px;max-width:1240px;margin:0 auto;position:relative}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.3px}
  .brand .mark{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:#04111C;border-radius:10px;font-weight:900;font-size:13px}
  .nav .links{display:flex;align-items:center;flex:1;margin-left:24px}
  .nav-main{display:flex;gap:30px;margin:0 auto;color:var(--muted);font-weight:500;font-size:15px;white-space:nowrap}
  .nav-auth .btn{white-space:nowrap}
  .nav-auth{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500;font-size:15px}
  .nav .links a{cursor:pointer;transition:color .15s}.nav .links a:hover{color:var(--ink)}
  .menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:18px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .btn.primary{background:var(--accent);color:#04111C}.btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn:disabled{opacity:.6;cursor:default}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px;color:var(--ink)}
  .chip .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#04111C;display:grid;place-items:center;font-weight:800;font-size:12px}

  /* type + sections */
  section{padding:56px 0}
  section[id]{scroll-margin-top:72px}
  .eyebrow,.subs-kicker{display:inline-flex;align-items:center;gap:10px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  .eyebrow::before,.subs-kicker::before{content:"";width:20px;height:2px;background:var(--accent);border-radius:2px}
  h2.sec{font-size:clamp(28px,3.3vw,40px);line-height:1.08;letter-spacing:-1.2px;font-weight:800;margin-bottom:12px}
  .sec-sub{color:var(--muted);font-size:16.5px;max-width:62ch;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .price{color:var(--accent);font-weight:700;font-size:14px}

  /* hero */
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .stat{padding:24px 26px;border-left:1px solid var(--line)}.stat:first-child{border-left:0}
  .stat b{display:block;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.8px}
  .stat span{color:var(--muted);font-size:14px}

  /* cards / grids */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .svc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;transition:border-color .15s,background .15s}
  .svc:hover{border-color:rgba(82,184,224,.45);background:#0F1826}
  .svc h3{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:8px}
  .svc p{color:var(--muted);font-size:15px;margin-bottom:18px;flex:1}
  .svc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
  .svc .tag{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .svc .result{color:var(--accent);font-weight:700;font-size:14px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(82,184,224,.45);color:var(--accent);font-weight:800;margin-bottom:16px}
  .step h3{font-size:19px;font-weight:700;margin-bottom:6px}.step p{color:var(--muted);font-size:15px}
  .tech{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 34px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--soft);font-size:18px;font-weight:700}
  .tech small{width:100%;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
  .cta{text-align:center;margin:24px 0 8px;padding:56px 24px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
  .cta .sec-sub{margin-left:auto;margin-right:auto}

  /* forms */
  label{display:grid;gap:6px;font-weight:600;color:var(--muted);font-size:14px;margin-bottom:16px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:#F8FBFF;padding:12px 14px;font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
  input::placeholder,textarea::placeholder{color:var(--soft)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,184,224,.18)}
  textarea{min-height:110px;resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .notice{padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:14px}
  .notice.err{background:rgba(239,111,92,.12);color:#FFB4A6;border:1px solid rgba(239,111,92,.25)}
  .notice.info{background:rgba(82,184,224,.10);color:#BFE6F6;border:1px solid rgba(82,184,224,.25)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(2,6,12,.72);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:20px}
  .modal-bg.open{display:grid}
  .modal{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:28px}
  .modal h3{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
  .modal .switch{margin-top:16px;color:var(--muted);font-size:14px}.modal .switch a{color:var(--accent);font-weight:700;cursor:pointer}
  .x{float:right;cursor:pointer;color:var(--soft);font-size:24px;line-height:1}.x:hover{color:var(--ink)}

  /* checkout / offer */
  .checkout{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:18px;margin-top:8px}
  .checkout .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
  .checkout .row.total{border-top:1px solid var(--line2);margin-top:8px;padding-top:12px;font-weight:800;font-size:18px}
  .free{color:var(--accent);font-weight:800}
  .beta{display:inline-block;background:rgba(82,184,224,.14);color:var(--accent);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:8px}

  /* my requests */
  .req{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
  .req .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .req h3{font-size:18px;font-weight:700}
  .req .meta{color:var(--soft);font-size:13px;margin:4px 0 10px}
  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .b-Received{background:rgba(99,189,231,.14);color:var(--blue)}
  .b-Inprogress{background:rgba(240,184,79,.14);color:var(--amber)}
  .b-Quotesent{background:rgba(165,180,252,.14);color:var(--purple)}
  .b-Completed{background:rgba(52,211,153,.14);color:var(--ok)}
  .b-Closed{background:rgba(239,111,92,.14);color:#FFB4A6}
  .ai-box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-top:12px;font-size:14px}
  .ai-box h4{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
  .empty{color:var(--muted);text-align:center;padding:48px 10px}

  /* subscription plans */
  .subs-inner{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 30px 26px}
  .subs-inner h2.sec{font-size:clamp(26px,2.8vw,34px)}
  .subs-inner .sec-sub{margin-bottom:24px;font-size:15.5px}
  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
  .plan{position:relative;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column}
  .plan.featured{border-color:var(--accent)}
  .plan-badge{position:absolute;top:-12px;left:24px;background:var(--accent);color:#04111C;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .plan h3{font-size:19px;font-weight:700;margin-bottom:6px}
  .plan-price{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0}
  .plan-price span{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
  .plan-tag{color:var(--muted);font-size:14.5px;margin-bottom:14px;min-height:0}
  .plan-feats{list-style:none;display:grid;gap:7px;margin:0 0 18px;flex:1;padding-top:14px;border-top:1px solid var(--line)}
  .plan-feats li{position:relative;padding-left:24px;font-size:14px}
  .plan-feats li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}

  /* footer */
  footer{border-top:1px solid var(--line);color:var(--soft);padding:40px 0;margin-top:40px;font-size:14px}
  .foot-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .foot-grid a{color:var(--muted)}.foot-grid a:hover{color:var(--ink)}
  .foot-links{display:flex;gap:22px;flex-wrap:wrap}

  /* hero v2 */
  .hero2{text-align:center;padding:96px 0 0;position:relative}
  .hero-badge{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);background:rgba(13,20,31,.7);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:28px}
  .dotlive{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
  .hero-title{font-size:clamp(42px,6.4vw,82px);line-height:1.02;letter-spacing:-.035em;font-weight:700;color:#EAF1F8;max-width:15ch;margin:0 auto 24px}
  .hero-title .dim{display:block;background:linear-gradient(180deg,#C5D2E2,#7B90AB);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-sub{color:var(--muted);font-size:clamp(17px,1.6vw,20px);max-width:58ch;margin:0 auto 36px}
  .hero-actions.center{justify-content:center}
  .btn.lg{padding:15px 28px;font-size:16px;border-radius:999px}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .flow{position:relative;margin-top:44px;aspect-ratio:1200/380;max-height:420px}
  .flow-svg{position:absolute;inset:0;width:100%;height:100%}
  .flow-core{position:absolute;left:50%;top:79%;transform:translate(-50%,-50%);width:124px;height:124px;border-radius:32px;display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 0%,#1C3150 0%,#0B1526 62%);border:1px solid rgba(124,203,235,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 6px rgba(82,184,224,.05),0 0 70px rgba(82,184,224,.3),0 30px 80px rgba(0,0,0,.55)}
  .core-logo{width:60px;height:60px;display:block;filter:drop-shadow(0 0 14px rgba(82,184,224,.55))}
  .core-logo svg{width:100%;height:100%;display:block}
  .core-ring{position:absolute;inset:-14px;border-radius:42px;border:1px solid rgba(124,203,235,.28);animation:ringPulse 3.6s ease-out infinite;pointer-events:none}
  .core-ring.r2{animation-delay:1.8s}
  @keyframes ringPulse{0%{opacity:.75;transform:scale(.9)}100%{opacity:0;transform:scale(1.38)}}
  .ftile{position:absolute;width:58px;height:58px;border-radius:17px;background:linear-gradient(180deg,rgba(22,36,58,.92),rgba(10,18,32,.92));border:1px solid rgba(124,203,235,.16);display:grid;place-items:center;transform:translate(-50%,-50%);animation:float 7s ease-in-out infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 34px rgba(0,0,0,.45),0 0 26px -10px currentColor}
  @keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 9px))}}
  @media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}.ftile{animation:none}.pt{display:none}.core-ring{animation:none;opacity:0}}

  /* home layout with "On this page" */
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:56px;margin-top:24px}
  .home-main{min-width:0}
  .toc{position:sticky;top:96px;align-self:start;padding-top:8px}
  .toc h5{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin:0 0 12px 16px}
  .toc a{display:block;padding:10px 16px;border-left:2px solid var(--line2);color:var(--muted);font-size:14px;cursor:pointer;transition:color .2s,background .2s,border-color .2s}
  .toc a:hover{color:var(--ink)}
  .toc a.active{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:linear-gradient(90deg,rgba(82,184,224,.10),rgba(82,184,224,0))}

  /* scroll reveal */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  /* cloud services (bento) */
  .cloud-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .cloud-cell{background:var(--panel);padding:26px;transition:background .2s}
  .cloud-cell:hover{background:#0F1826}
  .cc-icon{color:var(--accent);margin-bottom:14px}
  .cloud-cell h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .cloud-cell p{color:var(--muted);font-size:14.5px}

  /* prompt engineering */
  .split{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
  .ticks{list-style:none;display:grid;gap:11px}
  .ticks li{position:relative;padding-left:28px;font-size:16px}
  .ticks li::before{content:"";position:absolute;left:0;top:7px;width:14px;height:8px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .prompt-card{border:1px solid var(--line2);border-radius:16px;background:#08111E;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .pc-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .pc-bar i{width:10px;height:10px;border-radius:50%;background:#253247}
  .pc-bar span{margin-left:8px;color:var(--soft);font-size:13px;font-family:ui-monospace,Consolas,monospace}
  .pc-body{padding:22px 20px;font:13.5px/1.75 ui-monospace,Consolas,monospace;color:#C9D6E6;white-space:pre;overflow-x:auto;margin:0}
  .pl{display:block;opacity:0;transform:translateX(-6px);transition:opacity .45s ease,transform .45s ease;transition-delay:var(--d)}
  .pl:first-child{color:var(--accent);font-weight:700}
  .prompt-card.in .pl{opacity:1;transform:none}
  .caret{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-3px;animation:caret 1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.pl{opacity:1;transform:none;transition:none}.caret{animation:none}}

  /* guarantees + FAQ + audit */
  .founding{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;width:fit-content;max-width:100%;margin:0 auto 22px;padding:10px 18px;border:1px solid rgba(52,211,153,.35);border-radius:999px;background:rgba(52,211,153,.08);color:var(--ink);font-size:14.5px;text-align:center}
  .founding b{color:var(--ok)}
  .assure{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;margin-top:20px;color:var(--muted);font-size:14px;font-weight:500}
  .assure span::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
  .faq{border-top:1px solid var(--line)}
  .faq details{border-bottom:1px solid var(--line)}
  .faq summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;font-size:17px;font-weight:600;position:relative}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"";position:absolute;right:6px;top:50%;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
  .faq details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
  .faq summary:hover{color:var(--accent)}
  .faq details p{color:var(--muted);padding:0 40px 22px 0;max-width:75ch}
  .audit-score{display:flex;align-items:center;gap:22px;padding:20px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2)}
  .ring{--p:0;--c:var(--accent);width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#1F2A3A 0)}
  .ring b{width:74px;height:74px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:24px;font-weight:800}
  .audit-score h4{font-size:19px;margin-bottom:4px}.audit-score p{color:var(--muted);font-size:14.5px}
  .audit-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

  .svc-quote{color:var(--soft);font-size:13.5px;font-weight:600}
  /* tools page: sidebar + panel */
  .tools-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
  .tools-nav{position:sticky;top:90px;display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
  .tnav{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);font:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .tnav:hover{color:var(--ink);background:rgba(255,255,255,.02)}
  .tnav.active{color:var(--ink);background:rgba(82,184,224,.08);border-color:rgba(82,184,224,.28)}
  .tnav .ti{color:var(--accent);flex:none;margin-top:1px}
  .tnav b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
  .tnav small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
  .tools-panel .tool{display:none;min-height:420px}
  .tools-panel .tool.active{display:flex}
  /* request page: form + assistant side by side */
  .req-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
  .chat-side{position:sticky;top:90px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
  .chat-side #chatBox{max-height:none !important;flex:1;min-height:240px}

  /* bots */
  .bots-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bot-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;overflow:hidden;transition:border-color .2s,transform .2s}
  .bot-card::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
  .bot-card:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
  .bot-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:14px}
  .bot-card h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .bot-card p{color:var(--muted);font-size:14.5px}

  /* billing toggle */
  .billing{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);margin-bottom:20px}
  .billing button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
  .billing button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .billing .save{color:var(--ok);font-size:12px;font-weight:700;margin-left:6px}
  .plan-note{color:var(--ok);font-size:13px;font-weight:600;margin:-2px 0 8px}
  /* partners */
  .partners{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .partner{display:flex;flex-direction:column;gap:6px;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .partner h3{font-size:18px;font-weight:700}
  .partner p{color:var(--muted);font-size:15px;flex:1;margin-bottom:12px}
  .partner .btn{align-self:flex-start}
  /* niche pages */
  .niche-hero{padding-bottom:24px}
  .pain-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pain{padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .pain h3{font-size:18px;font-weight:700;margin-bottom:4px}
  .pain-p{color:var(--muted);font-size:15px}
  .pain-s{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
  .pain-s b{color:var(--accent);font-weight:700}
  .pack{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
  .pack-cta{padding:26px;border:1px solid rgba(82,184,224,.4);border-radius:16px;background:var(--bg)}
  .pack-cta h3{font-size:20px;font-weight:700;margin-bottom:6px}.pack-cta p{color:var(--muted);margin-bottom:16px}
  .pack-cta .btn{width:100%}
  /* contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .contact-card{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .15s}
  .contact-card:hover{border-color:rgba(82,184,224,.45)}
  .contact-card b{display:block}.contact-card small{color:var(--muted);font-size:14px}
  .chat-alt{padding:0 16px 10px;color:var(--soft);font-size:13px}.chat-alt a{color:var(--accent);font-weight:600}
  .btn svg{flex:none}

  /* cloudflare-style hero card */
  .hero2{padding:24px 0 0;text-align:center}
  .hero-card{position:relative;overflow:hidden;border-radius:28px;padding:84px 24px 0;background:radial-gradient(90% 120% at 50% 0%,#2B8FD0 0%,#1C6BAE 38%,#0E3D73 78%,#0A2C55 100%);border:1px solid rgba(124,203,235,.35);box-shadow:0 40px 120px rgba(20,110,190,.22)}
  .hero-card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px);background-size:7px 7px;-webkit-mask-image:radial-gradient(80% 70% at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(80% 70% at 50% 25%,#000,transparent 75%);pointer-events:none}
  .hero-card > *{position:relative}
  .hero-card .hero-title{color:#fff}
  .hero-card .hero-title .dim{background:linear-gradient(180deg,#E6F3FF,#9CC7EE);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-card .hero-sub{color:rgba(235,245,255,.88)}
  .hero-card .hero-badge{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
  .btn.light{background:#fff;color:#0A2340}.btn.light:hover{background:#E8F3FF}
  .btn.outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}.btn.outline-light:hover{border-color:#fff;background:rgba(255,255,255,.08)}
  .hero-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;margin-top:18px;color:var(--muted);font-size:14px}
  .hero-trust span::before{content:"✓";color:var(--ok);font-weight:800;margin-right:7px}
  .steps.four{grid-template-columns:repeat(4,1fr)}
  .plan-price small{font-size:14px;font-weight:600;color:var(--muted);margin-right:6px;letter-spacing:0}
  /* request page: compact so the whole form fits on one screen */
  .req-page{padding-top:20px}
  .req-page h2.sec{font-size:clamp(26px,3vw,34px);margin-bottom:4px}
  .req-page > .sec-sub{margin-bottom:16px}
  .req-page .card{padding:20px 22px}
  .req-page form label{margin-bottom:10px;font-size:13.5px}
  .req-page input,.req-page select{padding:9px 12px;font-size:14.5px}
  .req-page textarea{min-height:84px;padding:10px 12px;font-size:14.5px}
  .req-page .form-grid{gap:12px}
  .req-page .call-opt{padding:10px 12px}
  .req-page #chatBox{max-height:240px!important}
  /* optional free call */
  .call-opt{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;font-size:14px;color:var(--ink)}
  .call-opt input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
  .call-opt small{display:block;color:var(--soft);font-size:12.5px;margin-top:2px;font-weight:400}
  /* live tools */
  .tool{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:16px;min-width:0;scroll-margin-top:84px}
  .tool-wide{margin-bottom:16px}
  .tool h3{font-size:20px;font-weight:700;letter-spacing:-.2px;margin:4px 0}
  .tool p.desc{color:var(--muted);font-size:15px}
  .tool-kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .tool-icon{width:42px;height:42px;border-radius:11px;border:1px solid rgba(82,184,224,.4);background:rgba(82,184,224,.06);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
  .tool-input{display:flex;gap:10px}.tool-input input{flex:1;min-width:0}
  .tool-try{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--soft);font-size:13px;margin-top:-6px}
  .tool-try a{cursor:pointer;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 11px}.tool-try a:hover{color:var(--accent);border-color:var(--accent)}
  .tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .an-head{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2)}
  .an-head img{width:42px;height:42px;border-radius:10px;background:#fff;object-fit:contain;padding:5px;flex:none}
  .an-head b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.an-head a{color:var(--muted);font-size:13px;word-break:break-all}
  .an-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
  .pill.ok{color:var(--ok);border-color:rgba(52,211,153,.35)}.pill.bad{color:var(--red);border-color:rgba(239,111,92,.35)}
  .an-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
  .an-box{border:1px solid var(--line2);border-radius:12px;padding:18px;background:var(--bg);min-width:0}
  .an-box h4{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
  .swatch{background:transparent;border:1px solid var(--line2);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
  .swatch span{display:block;height:54px;border-bottom:1px solid var(--line2)}
  .swatch b{display:block;font:600 13px ui-monospace,Consolas,monospace;padding:7px 9px 0}
  .swatch small{display:block;padding:0 9px 8px;color:var(--soft);font-size:11px;text-transform:capitalize}
  .swatch:hover{border-color:var(--accent)}
  .token{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .token .dot{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2)}
  .token code{font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .token span:last-child{color:var(--soft);font:12px ui-monospace,Consolas,monospace;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .font-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .font-row span{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.font-row small{color:var(--soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip2{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--panel2)}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kv div{border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
  .kv b{display:block;font-size:20px}.kv span{color:var(--soft);font-size:12px}
  .check{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .check .ic{font-weight:800}.check small{display:block;color:var(--soft);font-size:13px;word-break:break-word}
  .score{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .score b{font-size:40px;font-weight:800;letter-spacing:-1px}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(82,184,224,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:9px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#04111C;font-weight:700;padding:10px 16px;border-radius:10px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .tool-teaser{cursor:pointer;transition:border-color .15s,background .15s}.tool-teaser:hover{border-color:rgba(82,184,224,.45);background:#0F1826}
  .tool-teaser .go{display:inline-block;color:var(--accent);font-weight:700;font-size:14px;margin-top:14px}

  /* chat widget */
  .chat-fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#04111C;display:grid;place-items:center;cursor:pointer;z-index:55;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background .15s,transform .15s}
  .chat-fab:hover{background:var(--accent2);transform:translateY(-2px)}
  .chat-panel{position:fixed;right:22px;bottom:92px;width:370px;height:min(560px,calc(100vh - 120px));background:var(--panel);border:1px solid var(--line2);border-radius:16px;display:none;flex-direction:column;overflow:hidden;z-index:56;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .chat-panel.open{display:flex}
  .chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .chat-head .x{margin-left:auto;float:none;background:none;border:0}
  .chat-av{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#04111C;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
  .chat-head b{display:block;font-size:15px}.chat-head small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .online{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .bub{max-width:86%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .bub.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .bub.me{align-self:flex-end;background:var(--accent);color:#04111C;border-bottom-right-radius:4px}
  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
  .chat-chips:empty{display:none}
  .chat-chips button{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
  .chat-chips button:hover{color:var(--accent);border-color:var(--accent)}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .chat-input input{padding:10px 12px}

  /* responsive */
  @media(max-width:1180px){.home-grid{grid-template-columns:1fr}.toc{display:none}}
  /* collapse the top menu while it no longer fits on one line (longer languages + language picker) */
  @media(max-width:1180px){
    .menu-btn{display:grid;place-items:center}
    .nav .links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;margin:0;flex:none;padding:6px 24px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
    .nav.open .links{display:flex}
    .nav-main,.nav-auth{flex-direction:column;align-items:stretch;gap:0;margin:0}
    .nav-main>a,.nav-auth>a:not(.btn),.nav-auth>span{padding:13px 2px;border-bottom:1px solid var(--line)}
    .nav-auth .btn{margin-top:10px}
  }
  @media(max-width:900px){
    .tools-layout,.req-layout{grid-template-columns:1fr}
    .ondemand,.partners,.about-grid,.pain-grid,.pack,.contact-grid{grid-template-columns:1fr}
    .tools-nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
    .tnav{flex:none}.tnav small{display:none}
    .tools-panel .tool{min-height:0}
    .chat-side{position:static;max-height:none}
    .chat-side #chatBox{max-height:320px !important}
    .home-grid{grid-template-columns:1fr}.toc{display:none}
    .split{grid-template-columns:1fr;gap:32px}
    .cloud-grid{grid-template-columns:1fr 1fr}
    .ftile{display:none}
    .grid,.steps{grid-template-columns:1fr 1fr}
    .price-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
    .form-grid{grid-template-columns:1fr}
    .tools-grid,.an-grid{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.nav{padding-left:16px;padding-right:16px}
    section{padding:44px 0}
    .grid,.steps{grid-template-columns:1fr}
    .stat{padding:18px}.stat b{font-size:26px}
    .subs-inner{padding:30px 18px}
    .cta{padding:40px 18px}
    .tool{padding:20px}
    .hero-actions.center .btn.lg{width:100%;max-width:320px}
    .audit-cols{grid-template-columns:1fr}
    .audit-score{flex-direction:column;text-align:center}
    .cloud-grid{grid-template-columns:1fr}
    .bots-grid{grid-template-columns:1fr}
    .hero2{padding-top:12px}
    .hero-card{padding:48px 16px 0;border-radius:20px}
    .steps.four{grid-template-columns:1fr}
    .flow{aspect-ratio:auto;height:230px}
    .flow-core{width:84px;height:84px;border-radius:20px}
    .tool-input{flex-direction:column}
    .kv{grid-template-columns:1fr 1fr}
    .chat-panel{left:10px;right:10px;width:auto;bottom:84px;height:calc(100vh - 110px)}
    .chat-fab{right:14px;bottom:14px}
  }
  .mark svg{width:64%;height:64%;display:block}
</style>

    const buf=await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));

  async function copyText(text, msg){
    try{ await navigator.clipboard.writeText(text); }

  async function runAudit(){
    const v=document.getElementById('auIn').value.trim(), out=document.getElementById('auOut'), btn=document.getElementById('auBtn');
    if(!v){ out.innerHTML='<div class="notice info">Enter your website to audit it.</div>'; return; }
    const host = v.replace(/^https?:[/][/]/i,'').split(/[/?#]/)[0];
    btn.disabled=true; out.innerHTML=spin('Checking security, email, SSL and speed…');
    const [sc, dm, an] = await Promise.allSettled([
      api('/api/tools/scan?url='+encodeURIComponent(v)),
      api('/api/tools/domain?domain='+encodeURIComponent(host)),
      api('/api/tools/analyze?url='+encodeURIComponent(v))
    ]);
    btn.disabled=false;
    if(sc.status!=='fulfilled' && dm.status!=='fulfilled'){ out.innerHTML=`<div class="notice err">${esc((sc.reason||dm.reason).message)}</div>`; return; }
    const checks=[];
    if(sc.status==='fulfilled'){
      const d=sc.value, missing=Object.entries(d.securityHeaders).filter(([,x])=>!x).map(([k])=>k.replace(/ [(].*/,''));
      checks.push({ok:d.https, label:'HTTPS enabled', fix:"Turn on HTTPS so browsers don't warn your visitors."});
      checks.push({ok:d.cloudflare, label:'DDoS protection & CDN', fix:'Put the site behind Cloudflare for speed and attack protection.'});
      checks.push({ok:!missing.length, label:'Security headers', fix:'Missing: '+missing.join(', ')+'.'});
      checks.push({ok:d.responseMs<1200, label:'Fast server response', fix:`The server took ${d.responseMs} ms; aim for under one second.`});
    }
    if(dm.status==='fulfilled') dm.value.checks.forEach(c=>checks.push({ok:c.ok, label:c.label, fix:c.detail}));
    if(an.status==='fulfilled'){ const kb=an.value.sizeKB+an.value.cssKB; checks.push({ok:kb<1500, label:'Page weight', fix:`Page and CSS weigh ${kb} KB; trimming it makes mobile loads faster.`}); }
    const passed=checks.filter(c=>c.ok).length, score=Math.round(100*passed/checks.length);
    const col = score>=90?'var(--ok)':(score>=60?'var(--amber)':'var(--red)');
    const failed=checks.filter(c=>!c.ok), good=checks.filter(c=>c.ok);
    const verdict = score>=90?'Looking healthy.':(score>=60?'A few things need attention.':'Your site needs some work.');
    out.innerHTML = `
      <div class="audit-score"><div class="ring" style="--p:${score};--c:${col}"><b>${score}</b></div>
        <div><h4>${esc(host)}: ${verdict}</h4><p>${passed} of ${checks.length} checks passed${failed.length?`, ${failed.length} to fix`:''}.</p></div></div>
      <div class="audit-cols">
        <div class="an-box"><h4>To fix (${failed.length})</h4>${failed.length?failed.map(c=>checkRow(false,c.label,c.fix)).join(''):'<p class="sec-sub" style="margin:0;font-size:14px">Nothing urgent. Nice work.</p>'}</div>
        <div class="an-box"><h4>Passed (${good.length})</h4>${good.map(c=>checkRow(true,c.label,'')).join('')}</div>
      </div>
      ${failed.length?`<div class="hero-actions" style="margin-top:16px"><button class="btn primary" onclick="startRequest('Website + Domain + Protection')">Fix these for me →</button><button class="btn ghost" onclick="document.getElementById('anIn').value='${esc(host)}';runAnalyze();selectTool('analyze')">See the design &amp; tech breakdown</button></div>`:''}`;
  }

  let lastAnalysis = null;
  async function runAnalyze(){

  // Everything below comes from a third-party site, so every value is escaped or validated.
  function analysisHTML(d){
    const fav=safeUrl(d.favicon);
    let host=d.finalUrl; try{ host=new URL(d.finalUrl).host; }catch(e){}
    const missing=Object.values(d.securityHeaders||{}).filter(v=>!v).length;
    const none = t => `<p class="sec-sub" style="margin:0;font-size:14px">${t}</p>`;
    const swatches = d.colors.length ? `<div class="swatches">${d.colors.map(c=>{ const h=safeHex(c.hex); return `<button class="swatch" type="button" data-copy="${h}" title="Copy ${h}"><span style="background:${h}"></span><b>${h}</b><small>${esc(c.role)} · ${Number(c.count)}×</small></button>`; }).join('')}</div>` : none('No colours found in the page CSS.');
    const fonts = d.fonts.length ? d.fonts.map(f=>{ const n=String(f.name).replace(/[^\w\s-]/g,''); return `<div class="font-row"><span style="font-family:'${n}',sans-serif">${esc(f.name)}</span><small>${Number(f.count)}×</small></div>`; }).join('') : none('System fonts, or fonts loaded by script.');
    const chips = (arr, empty) => arr.length ? `<div class="chips">${arr.map(x=>`<span class="chip2">${esc(x)}</span>`).join('')}</div>` : none(empty);
    const tokens = d.tokens.length ? `<div class="an-box" style="margin-top:16px"><h4>Design tokens (CSS variables)</h4>${d.tokens.map(t=>`<div class="token"><span class="dot" style="background:${safeHex(t.hex)}"></span><code>${esc(t.name)}</code><span>${esc(t.value)}</span></div>`).join('')}</div>` : '';
    return `
      <div class="an-head">${fav?`<img src="${esc(fav)}" alt="" onerror="this.style.display='none'">`:''}
        <div style="min-width:0"><b>${esc(d.title||host)}</b><a href="${esc(safeUrl(d.finalUrl))}" target="_blank" rel="noopener noreferrer">${esc(host)}</a>
          <div class="an-meta"><span class="pill ${d.https?'ok':'bad'}">${d.https?'HTTPS':'No HTTPS'}</span><span class="pill">${Number(d.responseMs)} ms</span><span class="pill">${Number(d.sizeKB)} KB HTML · ${Number(d.cssKB)} KB CSS</span>${d.cloudflare?'<span class="pill ok">Cloudflare</span>':''}<span class="pill ${missing?'bad':'ok'}">${missing?missing+' security header'+(missing>1?'s':'')+' missing':'Security headers OK'}</span></div>
        </div></div>
      ${d.description?`<p class="sec-sub" style="margin:14px 0 0;font-size:15px">${esc(d.description)}</p>`:''}
      <div class="an-grid">
        <div class="an-box"><h4>Colour palette</h4>${swatches}</div>
        <div class="an-box"><h4>Typography</h4>${fonts}<h4 style="margin-top:18px">Corner radius</h4>${chips(d.radii.map(r=>r.value),'None found.')}</div>
      </div>
      ${tokens}
      <div class="an-grid">
        <div class="an-box"><h4>Tech stack</h4>${chips(d.tech,'Nothing recognised (likely a custom build).')}</div>
        <div class="an-box"><h4>Page</h4><div class="kv"><div><b>${Number(d.counts.scripts)}</b><span>Scripts</span></div><div><b>${Number(d.counts.stylesheets)}</b><span>Stylesheets</span></div><div><b>${Number(d.counts.images)}</b><span>Images</span></div><div><b>${Number(d.counts.links)}</b><span>Links</span></div></div></div>
      </div>
      <div class="hero-actions" style="margin-top:16px"><button class="btn primary sm" type="button" id="anPrompt">Copy build prompt</button><button class="btn ghost sm" type="button" id="anCopy">Copy as CSS variables</button><button class="btn ghost sm" type="button" onclick="startRequest('Website & App Prompt Engineering')">Have us write it for you →</button></div>`;
  }
  // A ready-to-paste prompt for AI site builders, based on the analysed design system.
  function buildPrompt(d){
    let host=d.finalUrl; try{ host=new URL(d.finalUrl).host; }catch(e){}
    const by = r => d.colors.filter(c=>c.role===r).map(c=>c.hex);
    const dark = by('dark'), light = by('light'), accent = by('accent');
    const darkTheme = d.colors.filter(c=>c.role==='dark').reduce((n,c)=>n+c.count,0) > d.colors.filter(c=>c.role==='light').reduce((n,c)=>n+c.count,0);
    const bg = darkTheme ? (dark[0]||'#0B0F17') : (light[0]||'#FFFFFF'), text = darkTheme ? (light[0]||'#F1F5F9') : (dark[0]||'#111827');
    const fonts = d.fonts.map(f=>f.name).slice(0,2);
    return [
      `Build a modern, responsive website with a design system inspired by ${host}.`,

  function designCss(d){
    const by = r => d.colors.filter(c=>c.role===r);
    const lines=[];
    if(by('dark')[0]) lines.push(`  --color-dark: ${by('dark')[0].hex};`);
    if(by('light')[0]) lines.push(`  --color-light: ${by('light')[0].hex};`);
    by('accent').slice(0,3).forEach((c,i)=>lines.push(`  --color-accent${i?'-'+(i+1):''}: ${c.hex};`));
    d.tokens.slice(0,10).forEach(t=>lines.push(`  ${t.name}: ${t.value};`));
    if(d.fonts[0]) lines.push(`  --font-sans: '${d.fonts[0].name}', sans-serif;`);
    if(d.radii[0]) lines.push(`  --radius: ${d.radii[0].value};`);
    return `/* Design tokens extracted from ${d.finalUrl} */\n:root {\n${lines.join('\n')}\n}\n`;
  }

  // Scroll reveal + "On this page" highlighting. Observers are dropped on navigation.
  let homeObservers = [];
  function setupHomeEffects(){
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const heads = document.querySelectorAll('.home-main section > .eyebrow, .home-main section > h2.sec, .home-main section > .sec-sub, .split > div > .eyebrow, .split > div > h2.sec, .split > div > .sec-sub, .subs-inner > .subs-kicker, .subs-inner > h2.sec, .subs-inner > .sec-sub, .cta');
    heads.forEach(el=>el.classList.add('reveal'));
    document.querySelectorAll('.stats, #svcGrid, .cloud-grid, .bots-grid, .steps, .price-grid, #caseGrid, .split, .partners, .about-grid').forEach(group=>{
      [...group.children].forEach((el,i)=>{ el.classList.add('reveal'); el.style.setProperty('--d', Math.min(i,8)*70+'ms'); });
    });
    const items = document.querySelectorAll('.home-main .reveal');
    if(reduce || !('IntersectionObserver' in window)){ items.forEach(el=>el.classList.add('in')); }
    else {
      const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
      items.forEach(el=>io.observe(el)); homeObservers.push(io);
    }
    // Table of contents: highlight the section crossing the upper-middle of the screen.
    const links = document.querySelectorAll('.toc a');
    links.forEach(a=>a.onclick=()=>{ const el=document.getElementById(a.dataset.toc); if(el) el.scrollIntoView({behavior: reduce?'auto':'smooth'}); });
    if('IntersectionObserver' in window){
      const spy = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) links.forEach(a=>a.classList.toggle('active', a.dataset.toc===e.target.id)); }), { rootMargin:'-35% 0px -60% 0px' });
      TOC.forEach(([id])=>{ const el=document.getElementById(id); if(el) spy.observe(el); }); homeObservers.push(spy);
    }
  }

            <label>Service<select name="serviceType" id="svcSel" required><option value="">Choose…</option>${opts}</select></label>
            <label>Describe your problem<textarea name="problem" placeholder="e.g. I keep getting login attempts on my accounts and want to secure them." required>${planPending?esc(`I'd like the ${planPending.name} managed plan (${planPending.price}${planPending.period}). Please set up my website, hosting, protection`+(planPending.id!=='starter'?' and domain':'')+'.'):(pending&&pending.text?esc(pending.text):'')}</textarea></label>
            <label class="call-opt"><input type="checkbox" name="wantCall" id="wantCall" onchange="toggleCallPrefs(this.checked)"><span><b>I'd also like a free call</b> (optional)<small>Leave it unticked and we'll simply reply by email with the details.</small></span></label>
            <div class="form-grid" id="callPrefs" style="display:none">
              <label>Call me on<select name="callVia"><option>Phone</option><option>WhatsApp</option><option>Google Meet</option><option>Discord</option></select></label>
              <label>Best time<select name="callTime"><option>Any time</option><option>Morning (9-12)</option><option>Afternoon (12-17)</option><option>Evening (17-20)</option></select></label>
            </div>
            <p style="color:var(--soft);font-size:12px;margin-top:-4px">No tech knowledge needed: describe it in your own words.</p>
            <div id="checkoutArea"></div>
            <button class="btn primary" type="submit" style="width:100%;margin-top:6px" id="reqSubmit">Continue →</button>
          </form>
        </div>
        <div class="card chat-side">
          <div class="eyebrow" style="margin-bottom:8px">Assistant</div>
          <h3 style="margin:0 0 4px">Not sure what you need?</h3>
          <p class="sec-sub" style="font-size:14px;margin-bottom:12px">Describe your problem and we'll suggest the right service.</p>
          <div id="chatBox" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px"></div>
          <div id="chatTyping" class="sec-sub" style="font-size:13px;display:none;margin-top:6px">Typing…</div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input id="chatIn" placeholder="e.g. I need to monitor my websites and servers with alerts" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat();}">
            <button class="btn primary sm" onclick="sendChat()">Send</button>
          </div>
        </div>
        </div>
      </section>`;
    document.getElementById('reqForm').addEventListener('submit', onRequestSubmit);
    chatMessages=[{role:'assistant',content:"Hi! Tell me what you're trying to solve and I'll point you to the right service - for example: “I need to monitor my websites and servers with alerts.”"}];
    renderChat();
  }

  // ---- Live AI chat (LangGraph + LangChain) ----
  let chatMessages=[];
  function renderChat(){
    const box=document.getElementById('chatBox'); if(!box)return;
    box.innerHTML=chatMessages.map(m=>{
      const mine=m.role==='user';
      return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:85%;background:${mine?'var(--accent)':'var(--panel2)'};color:${mine?'#04111C':'var(--ink)'};border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap">${esc(m.content)}</div>`;
    }).join('');
    box.scrollTop=box.scrollHeight;
  }
  async function sendChat(){
    const inp=document.getElementById('chatIn'); if(!inp)return;
    const text=inp.value.trim(); if(!text)return;
    inp.value='';
    chatMessages.push({role:'user',content:text}); renderChat();
    const typing=document.getElementById('chatTyping'); if(typing)typing.style.display='block';
    try{
      const r=await api('/api/agent/chat',{method:'POST',body:JSON.stringify({messages:chatMessages, lang:(window.I18N&&I18N.lang)||'en'})});
      chatMessages.push({role:'assistant',content:r.reply||'…'});
    }catch(e){
      chatMessages.push({role:'assistant',content:'Sorry, I had trouble responding just now - please try again, or fill in the form below and our team will follow up.'});
    }
    if(typing)typing.style.display='none';
    renderChat();
  }

  let checkoutReady = false;
  // The free call is optional: show its options only when ticked, and redo the summary.
  function toggleCallPrefs(on){
    document.getElementById('callPrefs').style.display = on ? '' : 'none';
    if(checkoutReady){ checkoutReady = false; document.getElementById('checkoutArea').innerHTML = ''; document.getElementById('reqSubmit').textContent = 'Continue →'; }
  }
  async function onRequestSubmit(e){
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form).entries());
    data.email = (me && me.email) || (fbAuth && fbAuth.currentUser && fbAuth.currentUser.email) || '';
    const notice = document.getElementById('reqNotice');
    notice.innerHTML='';
    if(!data.serviceType){ notice.innerHTML='<div class="notice err">Please choose a service.</div>'; return; }
    if((data.problem||'').trim().length<10){ notice.innerHTML='<div class="notice err">Please describe your problem (at least 10 characters).</div>'; return; }

    if(!checkoutReady){
      // Show the offer summary first
      const svc = serviceMap[data.serviceType] || {};
      document.getElementById('checkoutArea').innerHTML = `
        <div class="checkout">
          <div class="row"><span>Service</span><span>${esc(data.serviceType)}</span></div>
          <div class="row"><span>Next step</span><span>${data.wantCall ? `Free call on ${esc(data.callVia||'Phone')} (${esc(data.callTime||'Any time')})` : 'We reply by email with the details'}</span></div>
          <div class="row total"><span>Price</span><span class="free">Tailored to you, agreed before we start</span></div>
        </div>
        <p class="sec-sub" style="margin:10px 0 0;font-size:13px">No payment now. We'll email you within one business day${data.wantCall ? ' to confirm a call time' : ''}.</p>`;
      document.getElementById('reqSubmit').textContent = 'Send request →';
      checkoutReady = true;
      return;
    }

    const btn = document.getElementById('reqSubmit');
    btn.disabled=true; btn.textContent='Placing…';
    try{
      const contactPref = data.wantCall ? `Wants a free call: ${data.callVia||'Phone'}, ${data.callTime||'Any time'}` : 'Contact by email only (no call requested)';
      const payload = { ...data, lang: (window.I18N && I18N.lang) || 'en', problem: `${data.problem.trim()}\n\n${contactPref}` };
      delete payload.callTime; delete payload.callVia; delete payload.wantCall;
      const res = await api('/api/leads',{method:'POST',body:JSON.stringify(payload)});
      const a = res.analysis||{};
      app.innerHTML = `
        <section style="max-width:640px;margin:0 auto">
          <div class="card" style="text-align:center">
            <div style="font-size:44px">✅</div>
            <h2 class="sec" style="margin-top:8px">Request placed!</h2>
            <p class="sec-sub">${esc(res.message)}</p>
            <div class="ai-box" style="text-align:left">
              <h4>✅ We received your request</h4>
              <p><b>Category:</b> ${esc(a.category)} · <b>Est.:</b> ${esc(a.estimateHours)}</p>
              ${a.reply?`<p style="margin-top:10px;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em">Our reply to you</p><p style="white-space:pre-wrap;margin-top:4px">${esc(a.reply)}</p>`:''}
              ${a.questions?`<p style="margin-top:10px;color:var(--muted)">To move faster, please have these ready:</p><ul style="margin:6px 0 0 18px;color:var(--muted)">${a.questions.split('\n').map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}
            </div>
            <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button class="btn primary" onclick="go('mine')">Track my requests</button>
              <button class="btn ghost" onclick="go('home')">Back home</button>
            </div>
          </div>
        </section>`;
      checkoutReady=false; pending=null; planPending=null;
    }catch(err){
      btn.disabled=false; btn.textContent='Place request (free) →';
      document.getElementById('reqNotice').innerHTML = `<div class="notice err">${esc(err.message)}</div>`;
    }
  }

  async function renderMine(){
    if(!me){ openAuth('login'); return renderHome(); }
    app.innerHTML = `<section><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2 class="sec">My requests</h2><button class="btn primary sm" onclick="startRequest()">+ New request</button></div><div id="mineList" style="margin-top:16px"><div class="empty">Loading…</div></div></section>`;
    await buildMine();
    if(mineTimer) clearInterval(mineTimer);
    mineTimer = setInterval(pollMine, 12000);   // pick up the team's reply (~1 min)
  }
  function threadHTML(l){
    const msgs = (l.messages||[]).map(m=>({...m}));
    if(!msgs.length) return '<div class="sec-sub" style="font-size:13px">No messages yet.</div>';
    // Older requests stored the questions separately: fold them into our first reply.
    const qs = String((l.analysis||{}).questions||'').split('\n').map(q=>q.trim()).filter(Boolean);
    const first = msgs.find(m=>m.sender==='team');
    if(first && qs.length && !first.text.includes(qs[0])) first.text += '\n\nTo move faster, could you tell us:\n' + qs.map(q=>'\u2022 '+q).join('\n');
    return msgs.map(m=>{
      const team = m.sender==='team';
      return `<div style="display:flex;justify-content:${team?'flex-start':'flex-end'};margin:6px 0"><div style="max-width:85%;background:${team?'var(--panel2)':'var(--accent)'};color:${team?'var(--ink)':'#04111C'};border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap">${esc(m.text)}</div></div>`;
    }).join('');
  }
  async function buildMine(){
    try{
      const { leads } = await api('/api/my/leads');
      const box = document.getElementById('mineList'); if(!box) return;
      if(!leads.length){ box.innerHTML = `<div class="empty">You haven't requested anything yet. <a style="color:var(--accent);cursor:pointer" onclick="startRequest()">Request a service →</a></div>`; return; }
      box.innerHTML = leads.map(l=>{
        const a=l.analysis||{}; const cls='b-'+(l.statusLabel||'').replace(/\s/g,'');
        return `<div class="req">
          <div class="top"><h3>${esc(a.category||l.serviceType)}</h3><span class="badge ${cls}">${esc(l.statusLabel)}</span></div>
          <div class="meta">Requested ${new Date(l.createdAt).toLocaleDateString()} · Est. ${esc(a.estimateHours||'-')} · Urgency ${esc(a.aiUrgency||a.urgencyLabel||l.urgency)}</div>
          <p>${esc(l.problem)}</p>
          <div class="ai-box" style="border-color:rgba(82,184,224,.45)">
            <h4>💬 Conversation</h4>
            <div id="thread-${l.id}" style="max-height:320px;overflow-y:auto;padding-right:4px">${threadHTML(l)}</div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <input id="msgin-${l.id}" placeholder="Write a reply…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg('${l.id}')}">
              <button class="btn primary sm" onclick="sendMsg('${l.id}')">Send</button>
            </div>
            <p class="sec-sub" style="font-size:12px;margin-top:6px">Our team usually replies within a minute. You can also arrange a call on Google Meet or Discord.</p>
          </div>
        </div>`;
      }).join('');
      // Jump each thread to the latest message.
      leads.forEach(l=>{ const el=document.getElementById('thread-'+l.id); if(el) el.scrollTop=el.scrollHeight; });
    }catch(e){ const box=document.getElementById('mineList'); if(box) box.innerHTML=`<div class="notice err">${esc(e.message)}</div>`; }
  }
  // Poll: refresh only the thread bodies so typing isn't interrupted.
  async function pollMine(){
    try{
      const { leads } = await api('/api/my/leads');
      for(const l of leads){
        const el=document.getElementById('thread-'+l.id); if(!el) continue;
        const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.innerHTML = threadHTML(l);
        if(atBottom) el.scrollTop = el.scrollHeight;
      }
    }catch(e){}
  }
  async function sendMsg(id){
    const inp=document.getElementById('msgin-'+id); if(!inp) return;
    const t=(inp.value||'').trim(); if(!t) return;
    inp.value=''; inp.disabled=true;
    try{
      await api('/api/my/leads/'+id+'/messages',{method:'POST',body:JSON.stringify({text:t})});
      await pollMine();
      const el=document.getElementById('thread-'+id); if(el) el.scrollTop=el.scrollHeight;
    }catch(e){ inp.value=t; alert(e.message); }
    inp.disabled=false; inp.focus();
  }

  // ---- Auth modal (dual-mode: Firebase when configured, else cookie login) ----
  let authMode='login';
  function closeAuth(){ document.getElementById('authModal').classList.remove('open'); }
  function authError(msg){ document.getElementById('authNotice').innerHTML = `<div class="notice err">${esc(msg)}</div>`; }

  function openAuth(mode, msg){
    authMode = mode;
    const fb = useFirebase();
    document.getElementById('authModal').classList.add('open');
    document.getElementById('authTitle').textContent = mode==='login'?'Log in':'Create your account';
    document.getElementById('authSub').textContent = msg || (mode==='login'?'Welcome back.':"Sign up to request and track services. It's free.");
    document.getElementById('authNotice').innerHTML = msg?`<div class="notice info">${esc(msg)}</div>`:'';
    const idField = fb
      ? `<label>Email<input id="authEmail" type="email" autocomplete="email" placeholder="you@email.com"></label>`
      : `<label>Username<input id="authUser" autocomplete="username"></label>`;
    document.getElementById('authBody').innerHTML = `
      ${idField}
      <label>Password<input id="authPass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"></label>
      ${fb&&mode==='login'?`<div style="text-align:right;margin:-8px 0 12px"><a id="forgotLink" style="color:var(--accent);cursor:pointer;font-size:13px">Forgot password?</a></div>`:''}
      <button class="btn primary" style="width:100%" id="authBtn">${mode==='login'?'Log in':'Create account'}</button>
      ${fb?`<div style="display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12px;margin:12px 0"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
            <button class="btn ghost" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px" id="googleBtn">${GOOGLE_G}${mode==='register'?'Sign up with Google':'Continue with Google'}</button>`:''}
      <p class="switch" id="authSwitch">${mode==='login'?`New here? <a onclick="openAuth('register')">Create an account</a>`:`Already have an account? <a onclick="openAuth('login')">Log in</a>`}</p>`;
    document.getElementById('authBtn').addEventListener('click', doAuth);
    document.getElementById('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
    if(fb){
      document.getElementById('googleBtn').addEventListener('click', doGoogle);
      const fl=document.getElementById('forgotLink'); if(fl) fl.addEventListener('click', doReset);
    }
    setTimeout(()=>{ const f=document.getElementById(fb?'authEmail':'authUser'); if(f) f.focus(); },50);
  }

  async function afterAuth(){ await loadMe(); closeAuth(); if(pending){ renderRequest(); } else { go('mine'); } }

  async function doAuth(){
    const password = document.getElementById('authPass').value;
    const btn=document.getElementById('authBtn');
    if(useFirebase()){
      const email = (document.getElementById('authEmail').value||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authError('Please enter a valid email.');
      if(password.length < (authMode==='register'?8:1)) return authError(authMode==='register'?'Password must be at least 8 characters.':'Please enter your password.');
      btn.disabled=true; btn.textContent='…';
      try{
        if(authMode==='register') await FB.createUserWithEmailAndPassword(fbAuth, email, password);
        else await FB.signInWithEmailAndPassword(fbAuth, email, password);
        await afterAuth();
      }catch(err){ authError(fbMsg(err)); btn.disabled=false; btn.textContent=authMode==='login'?'Log in':'Create account'; }
      return;
    }
    const username = (document.getElementById('authUser').value||'').trim();
    if(username.length<3) return authError('Username must be at least 3 characters.');
    if(authMode==='register' && password.length<8) return authError('Password must be at least 8 characters.');
    if(!password) return authError('Please enter your password.');
    btn.disabled=true; btn.textContent='…';
    try{
      await api(authMode==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify({username,password})});
      await afterAuth();
    }catch(err){ authError(err.message); btn.disabled=false; btn.textContent=authMode==='login'?'Log in':'Create account'; }
  }

  async function doGoogle(){
    try{ await FB.signInWithPopup(fbAuth, new FB.GoogleAuthProvider()); await afterAuth(); }
    catch(err){ authError(fbMsg(err)); }
  }
  async function doReset(){
    const email=(document.getElementById('authEmail').value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authError('Enter your email above first, then click Forgot password.');
    try{ await FB.sendPasswordResetEmail(fbAuth, email); document.getElementById('authNotice').innerHTML='<div class="notice info">Password reset email sent - check your inbox.</div>'; }
    catch(err){ authError(fbMsg(err)); }
  }
  function fbMsg(err){
    const c=(err&&err.code)||'';
    if(c.includes('email-already-in-use')) return 'That email already has an account - try logging in.';
    if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Invalid email or password.';
    if(c.includes('weak-password')) return 'Password is too weak.';
    if(c.includes('popup-closed')||c.includes('cancelled-popup')) return 'Sign-in was cancelled.';
    if(c.includes('too-many-requests')) return 'Too many attempts - please wait a moment.';
    return (err&&err.message)||'Authentication failed.';
  }

  async function logout(){
    if(fbAuth){ try{ await FB.signOut(fbAuth); }catch(e){} }
    try{ await api('/api/auth/logout',{method:'POST'}); }catch(e){}
    me=null; fbUser=null; renderNav(); go('home');
  }

  // ---------- Site chat widget (every page) ----------
  const W_GREETING = "Hi! I'm the LeadFlow assistant. Tell me what you need and I'll help you request the right service.";
  const W_CHIPS = ["What do you offer?", "I need a website", "My site is slow or down", "Can we book a call?"];
  let wMsgs = [], wBusy = false;
  try { wMsgs = JSON.parse(sessionStorage.getItem('lfChat') || '[]'); if(!Array.isArray(wMsgs)) wMsgs = []; } catch(e) { wMsgs = []; }
  function wSave(){ try{ sessionStorage.setItem('lfChat', JSON.stringify(wMsgs.slice(-30))); }catch(e){} }
  function wRender(){
    const body=document.getElementById('wBody');
    body.innerHTML = [{role:'assistant',content:W_GREETING}, ...wMsgs].map(m=>`<div class="bub ${m.role==='user'?'me':'bot'}">${esc(m.content)}</div>`).join('')
      + (wBusy ? '<div class="bub bot typing"><span></span><span></span><span></span></div>' : '');
    body.scrollTop = body.scrollHeight;
    document.getElementById('wChips').innerHTML = wMsgs.length ? '' : W_CHIPS.map(c=>`<button type="button">${esc(c)}</button>`).join('');
    document.querySelectorAll('#wChips button').forEach(b=>b.onclick=()=>wSend(b.textContent));
  }
  function toggleWidget(open){
    const p=document.getElementById('chatPanel');
    const show = open===undefined ? !p.classList.contains('open') : open;
    p.classList.toggle('open', show);
    document.getElementById('chatFab').setAttribute('aria-expanded', String(show));
    if(show){ wRender(); setTimeout(()=>document.getElementById('wIn').focus(), 30); }
  }
  async function wSend(text){
    text = String(text||'').trim(); if(!text || wBusy) return;
    wMsgs.push({role:'user', content:text.slice(0,600)}); wBusy=true; wRender();
    const started=Date.now();
    let reply;
    try{
      const r = await api('/api/agent/chat', {method:'POST', body:JSON.stringify({messages:[{role:'assistant',content:W_GREETING}, ...wMsgs].slice(-12), lang:(window.I18N&&I18N.lang)||'en'})});
      reply = r.reply || "Sorry, I didn't catch that. Could you rephrase?";
    }catch(e){ reply = e.message && /too many/i.test(e.message) ? e.message : "Sorry, I couldn't answer just now. You can still send a request and the team will reply within a day."; }
    const wait = 600 - (Date.now()-started); if(wait>0) await new Promise(r=>setTimeout(r,wait));   // feels less robotic
    wMsgs.push({role:'assistant', content:reply}); wBusy=false; wSave(); wRender();
  }
  document.getElementById('chatFab').onclick = () => toggleWidget();
  // Optional contact channels from /site-config.js (hidden when not set).
  if(CONTACT.whatsapp) document.getElementById('wAlt').innerHTML = `Prefer WhatsApp? <a href="${esc(waLink('Hi! I have a question about your services.'))}" target="_blank" rel="noopener">Message us</a>`;
  document.getElementById('footContact').innerHTML = [CONTACT.phone?`<a href="tel:${esc(CONTACT.phone.replace(/[^+\d]/g,''))}">${esc(CONTACT.phone)}</a>`:'', CONTACT.whatsapp?`<a href="${esc(waLink(''))}" target="_blank" rel="noopener">WhatsApp</a>`:'', CONTACT.booking?`<a href="${esc(CONTACT.booking)}" target="_blank" rel="noopener">Book a call</a>`:''].filter(Boolean).join(' · ');
  document.getElementById('wForm').onsubmit = e => { e.preventDefault(); const i=document.getElementById('wIn'); const t=i.value; i.value=''; wSend(t); };
  document.addEventListener('keydown', e => { if(e.key==='Escape') toggleWidget(false); });

  (async function init(){
    await loadServices();
    await loadMe();                       // sets backendFirebase from /api/auth/me
    if(useFirebase()){ await initFirebase(); }
    const nm = location.pathname.match(/^\/for\/([a-z-]+)\/?$/);
    if(nm && NICHES[nm[1]]){ currentView='niche'; renderNiche(nm[1]); }
    else { currentView='home'; renderHome(); }
  })();
</script>
</body>
</html>
