<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Optimized bold helm: balanced negative space for 16px readability while remaining modern and protective -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#52B8E0" stroke-width="10"/>
  <!-- Longer spokes almost connecting rim to hub -->
  <g stroke="#52B8E0" stroke-width="7" stroke-linecap="round">
    <line x1="50" y1="15" x2="50" y2="35"/>
    <line x1="50" y1="65" x2="50" y2="85"/>
    <line x1="15" y1="50" x2="35" y2="50"/>
    <line x1="65" y1="50" x2="85" y2="50"/>
    <line x1="24.5" y1="24.5" x2="38" y2="38"/>
    <line x1="62" y1="62" x2="75.5" y2="75.5"/>
    <line x1="75.5" y1="24.5" x2="62" y2="38"/>
    <line x1="38" y1="62" x2="24.5" y2="75.5"/>
  </g>
  <circle cx="50" cy="50" r="14" fill="none" stroke="#52B8E0" stroke-width="7"/>
  <circle cx="50" cy="50" r="5" fill="#52B8E0"/>
</svg>
