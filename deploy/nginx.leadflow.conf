# LeadFlow AI — Nginx reverse proxy (safe, self-contained).
# Put at /etc/nginx/sites-available/leadflow, symlink into sites-enabled, then run certbot.
# Change server_name if you use a different domain. This does NOT touch your other sites.

server {
    listen 80;
    server_name leadflow.cookblog.net;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
